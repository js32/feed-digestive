# /etc/nginx/sites-available/rss.js32.de
# Aktivieren: ln -s /etc/nginx/sites-available/rss.js32.de /etc/nginx/sites-enabled/
# Zertifikat:  certbot --nginx -d rss.js32.de   (oder deine bestehende Lösung)

server {
    listen 80;
    listen [::]:80;
    server_name rss.js32.de;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name rss.js32.de;

    ssl_certificate     /etc/letsencrypt/live/rss.js32.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rss.js32.de/privkey.pem;

    # Nur der Feed (und der Health-Check) werden durchgereicht, alles andere 404.
    location ~ ^/[A-Za-z0-9_-]+/feed\.xml$ {
        proxy_pass http://127.0.0.1:8087;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Klick-Zähler: /<token>/r/<id> -> Weiterleitung zum Artikel
    location ~ ^/[A-Za-z0-9_-]+/r/[0-9]+$ {
        proxy_pass http://127.0.0.1:8087;
        proxy_set_header Host $host;
        proxy_set_header User-Agent $http_user_agent;
    }
    location = /healthz { proxy_pass http://127.0.0.1:8087; }
    location / { return 404; }

    # Feed-Abrufe nicht mit geheimem Pfad ins Log schreiben
    access_log off;
}
